[project]
name = "olist-consumer-intelligence"
version = "0.1.0"
description = "Olist Consumer Intelligence & Market Intelligence Assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "polars>=1.10.0",
    "numpy>=1.26.0",
    "plotly>=5.22.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "pandera>=0.19.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "jupyterlab>=4.2.0",
    "notebook>=7.0.0",
    "ipykernel>=6.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]